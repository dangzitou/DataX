name: MySQL reader and transport regression
on:
  push:
    branches: [master, 'perf/**']
    paths-ignore: ['**/*.md', 'benchmarks/results/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - name: Unit tests
        run: |
          mvn -B -pl core,plugin-rdbms-util,rdbmsreader,mysqlreader,mysqlwriter,streamreader,streamwriter -am test
          python3 benchmarks/test_performance_gate.py
      - name: Build focused distribution
        run: python3 benchmarks/build.py . /tmp/datax-ci
      - name: Start disposable MySQL
        run: |
          docker run -d --name datax-perf-mysql -p 127.0.0.1:23306:3306 \
            -e MYSQL_ALLOW_EMPTY_PASSWORD=yes -e MYSQL_DATABASE=datax_bench \
            mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b \
            --default-authentication-plugin=mysql_native_password
          for i in $(seq 1 60); do
            if docker exec datax-perf-mysql mysql --protocol=tcp -h127.0.0.1 -uroot -e 'SELECT 1'; then break; fi
            sleep 2
          done
          docker exec datax-perf-mysql mysql -uroot -e "CREATE USER 'datax'@'%' IDENTIFIED WITH mysql_native_password BY 'datax-local-benchmark'; GRANT ALL ON datax_bench.* TO 'datax'@'%';"
      - name: Seed data and run real database checks
        run: |
          python3 -c 'import sys; sys.path.insert(0, "benchmarks"); from mysql_querysql import seed; seed(10000)'
          python3 benchmarks/mysql_checks.py /tmp/datax-ci /tmp/datax-ci-checks
      - name: JDBC commit acknowledgement fault injection with real MySQL
        run: python3 benchmarks/jdbc_commit_checks.py /tmp/datax-ci /tmp/mysql-commit-checks --backend mysql
