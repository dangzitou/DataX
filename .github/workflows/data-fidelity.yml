name: PostgreSQL and StarRocks data fidelity
on:
  push:
    branches: [master, 'perf/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - name: Unit tests including both CSV codecs
        run: mvn -B -pl core,plugin-rdbms-util,postgresqlreader,postgresqlwriter,starrocksreader,starrockswriter,dorisreader,doriswriter -am test
      - name: Build untouched baseline then candidate
        run: |
          git fetch --depth 1 origin 80ec23d5c5328eb90ca364d2749e92dfaf44541e
          git worktree add --detach /tmp/datax-baseline-src 80ec23d5c5328eb90ca364d2749e92dfaf44541e
          python3 benchmarks/build.py /tmp/datax-baseline-src /tmp/datax-baseline --extra-modules postgresqlreader postgresqlwriter starrocksreader starrockswriter dorisreader doriswriter
          python3 benchmarks/build.py . /tmp/datax-candidate --extra-modules postgresqlreader postgresqlwriter starrocksreader starrockswriter dorisreader doriswriter
      - name: Start disposable PostgreSQL
        run: |
          docker run -d --name datax-perf-postgres --memory 1g -p 127.0.0.1:25432:5432 \
            -e POSTGRES_PASSWORD=datax-local-benchmark -e POSTGRES_DB=datax_bench \
            postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73 \
            -c fsync=on -c synchronous_commit=on -c full_page_writes=on
          for i in $(seq 1 60); do
            if docker exec datax-perf-postgres pg_isready -U postgres; then break; fi
            sleep 2
          done
          docker exec datax-perf-postgres pg_isready -U postgres
      - name: PostgreSQL field fidelity and rerun hazards
        run: python3 benchmarks/postgresql_checks.py /tmp/datax-baseline /tmp/datax-candidate /tmp/pg-checks
      - name: Start disposable StarRocks
        run: |
          docker run -d --name datax-perf-starrocks --memory 4g \
            -p 127.0.0.1:29030:9030 -p 127.0.0.1:28030:8030 -p 127.0.0.1:28040:8040 \
            starrocks/allin1-ubuntu@sha256:faf7ce9c24d9c29c9431b4e8cbd4bb7a74cd169907c63f0c5ebaacc7f9df276b
          for i in $(seq 1 120); do
            if docker exec datax-perf-starrocks mysql -uroot -h127.0.0.1 -P9030 -e 'SHOW BACKENDS' | grep -q true; then break; fi
            sleep 2
          done
          docker exec datax-perf-starrocks mysql -uroot -h127.0.0.1 -P9030 -e 'SHOW BACKENDS' | grep -q true
      - name: PostgreSQL to StarRocks and back
        run: python3 benchmarks/starrocks_checks.py /tmp/datax-baseline /tmp/datax-candidate /tmp/sr-checks
