name: PostgreSQL, StarRocks and Doris data fidelity
on:
  push:
    branches: [master, 'perf/**']
    paths-ignore: ['**/*.md', 'benchmarks/results/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - name: Unit tests including both CSV codecs
        run: mvn -B -pl core,plugin-rdbms-util,postgresqlreader,postgresqlwriter,starrocksreader,starrockswriter,dorisreader,doriswriter,selectdbwriter,streamwriter -am test
      - name: Build untouched baseline then candidate
        run: |
          git fetch --depth 1 origin 80ec23d5c5328eb90ca364d2749e92dfaf44541e
          git worktree add --detach /tmp/datax-baseline-src 80ec23d5c5328eb90ca364d2749e92dfaf44541e
          python3 benchmarks/build.py /tmp/datax-baseline-src /tmp/datax-baseline --extra-modules postgresqlreader postgresqlwriter starrocksreader starrockswriter dorisreader doriswriter
          python3 benchmarks/build.py . /tmp/datax-candidate --extra-modules postgresqlreader postgresqlwriter starrocksreader starrockswriter dorisreader doriswriter selectdbwriter
      - name: Binary codec and factory checks (SelectDB codec only)
        run: python3 benchmarks/binary_codec_checks.py /tmp/datax-candidate /tmp/binary-codecs
      - name: HTTP payload integrity, replay and constrained heap (no database)
        run: |
          python3 benchmarks/stream_load_payload_checks.py /tmp/datax-baseline /tmp/payload-baseline --backends starrocks,doris --expect-oom
          python3 benchmarks/stream_load_payload_checks.py /tmp/datax-candidate /tmp/payload-streamed --backends starrocks,selectdb
          python3 benchmarks/stream_load_payload_checks.py /tmp/datax-candidate /tmp/payload-doris --backends doris --expect-oom
      - name: Stream Load queued failure and task shutdown (HTTP simulator)
        run: |
          python3 benchmarks/stream_load_queue_checks.py /tmp/datax-baseline /tmp/queue-baseline --expect-unsafe
          python3 benchmarks/stream_load_queue_checks.py /tmp/datax-candidate /tmp/queue-candidate --backends starrocks,doris,selectdb
      - name: Stream Load fatal worker and timer errors (HTTP simulator)
        run: |
          python3 benchmarks/stream_load_fatal_checks.py /tmp/datax-candidate /tmp/fatal-candidate
          python3 benchmarks/stream_load_fatal_checks.py /tmp/datax-candidate /tmp/fatal-engine --engine --backends starrocks,doris
      - name: Stream Load status fault injection (HTTP simulator)
        run: |
          python3 benchmarks/stream_load_status_checks.py /tmp/datax-baseline /tmp/status-baseline --expect-unsafe --expect-incomplete --expect-unverified
          python3 benchmarks/stream_load_status_checks.py /tmp/datax-candidate /tmp/status-candidate
      - name: File record integrity and delimiters
        run: |
          python3 benchmarks/streamwriter_checks.py /tmp/datax-baseline /tmp/file-baseline --expect-legacy
          python3 benchmarks/streamwriter_checks.py /tmp/datax-candidate /tmp/file-candidate
      - name: Start disposable PostgreSQL
        run: |
          docker run -d --name datax-perf-postgres --memory 1g -p 127.0.0.1:25432:5432 \
            -e POSTGRES_PASSWORD=datax-local-benchmark -e POSTGRES_DB=datax_bench \
            postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73 \
            -c fsync=on -c synchronous_commit=on -c full_page_writes=on
          for i in $(seq 1 60); do
            if docker exec datax-perf-postgres pg_isready -U postgres; then break; fi
            sleep 2
          done
          docker exec datax-perf-postgres pg_isready -U postgres
      - name: PostgreSQL field fidelity and rerun hazards
        run: python3 benchmarks/postgresql_checks.py /tmp/datax-baseline /tmp/datax-candidate /tmp/pg-checks
      - name: PostgreSQL nullable integer binding and overflow
        run: python3 benchmarks/postgresql_binding_checks.py /tmp/datax-candidate /tmp/pg-binding-checks
      - name: PostgreSQL integer reads and exact numeric boundaries
        run: python3 benchmarks/postgresql_integer_checks.py /tmp/datax-candidate /tmp/pg-integer-checks
      - name: PostgreSQL floating values, filtering and binary NUMERIC infinity
        run: |
          python3 benchmarks/postgresql_float_checks.py /tmp/datax-baseline /tmp/float-baseline --jdbc-only --expect-filter-failure --expect-binary-numeric-failure
          python3 benchmarks/postgresql_float_checks.py /tmp/datax-candidate /tmp/float-candidate
      - name: JDBC commit acknowledgement fault injection with real PostgreSQL
        run: |
          python3 benchmarks/jdbc_commit_checks.py /tmp/datax-baseline /tmp/commit-baseline --expect-legacy
          python3 benchmarks/jdbc_commit_checks.py /tmp/datax-candidate /tmp/commit-candidate
          python3 benchmarks/postgresql_commit_wire_checks.py /tmp/datax-baseline /tmp/commit-wire-baseline --expect-legacy
          python3 benchmarks/postgresql_commit_wire_checks.py /tmp/datax-candidate /tmp/commit-wire-candidate
      - name: PostgreSQL shared snapshot and source changes
        run: |
          python3 benchmarks/postgresql_snapshot_checks.py /tmp/datax-baseline /tmp/snapshot-baseline --expect-inconsistent
          python3 benchmarks/postgresql_snapshot_checks.py /tmp/datax-candidate /tmp/snapshot-candidate
      - name: PostgreSQL atomic append, precision rejection and real connection failures
        run: python3 benchmarks/postgresql_atomic_checks.py /tmp/datax-candidate /tmp/pg-atomic-checks
      - name: PostgreSQL querySql splitting and read-only prechecks
        run: python3 benchmarks/postgresql_querysql_checks.py /tmp/datax-candidate /tmp/pg-query-checks
      - name: PostgreSQL native writer regression
        run: |
          python3 benchmarks/postgresql_writer_checks.py /tmp/datax-candidate /tmp/pg-driver-checks
          python3 benchmarks/postgresql_copy_checks.py /tmp/datax-candidate /tmp/pg-copy-checks
          python3 benchmarks/postgresql_time_checks.py /tmp/datax-baseline /tmp/pg-time-baseline --mode jdbc --expect-loss
          python3 benchmarks/postgresql_time_checks.py /tmp/datax-candidate /tmp/pg-time-candidate
          python3 benchmarks/postgresql_time_checks.py /tmp/datax-candidate /tmp/pg-time-binary --binary
      - name: Start disposable StarRocks
        run: |
          docker run -d --name datax-perf-starrocks --memory 4g \
            -p 127.0.0.1:29030:9030 -p 127.0.0.1:28030:8030 -p 127.0.0.1:28040:8040 \
            starrocks/allin1-ubuntu@sha256:faf7ce9c24d9c29c9431b4e8cbd4bb7a74cd169907c63f0c5ebaacc7f9df276b
          probe='CREATE DATABASE IF NOT EXISTS datax_bench; CREATE TABLE IF NOT EXISTS datax_bench.ci_readiness (id BIGINT) DUPLICATE KEY(id) DISTRIBUTED BY HASH(id) BUCKETS 1 PROPERTIES("replication_num"="1");'
          for i in $(seq 1 120); do
            if docker exec datax-perf-starrocks mysql -uroot -h127.0.0.1 -P9030 -e "$probe"; then break; fi
            sleep 2
          done
          docker exec datax-perf-starrocks mysql -uroot -h127.0.0.1 -P9030 -e "$probe"
      - name: PostgreSQL to StarRocks and back
        run: python3 benchmarks/starrocks_checks.py /tmp/datax-baseline /tmp/datax-candidate /tmp/sr-checks
      - name: PostgreSQL binary values through StarRocks
        run: |
          python3 benchmarks/olap_binary_checks.py /tmp/datax-baseline /tmp/sr-binary-baseline --expect-legacy
          python3 benchmarks/olap_binary_checks.py /tmp/datax-candidate /tmp/sr-binary-candidate
      - name: StarRocks queued failure against real server with response proxy
        run: |
          python3 benchmarks/stream_load_queue_checks.py /tmp/datax-baseline /tmp/starrocks-queue-before --backends starrocks --real-database --expect-unsafe
          python3 benchmarks/stream_load_queue_checks.py /tmp/datax-candidate /tmp/starrocks-queue-after --backends starrocks --real-database
      - name: StarRocks rejects incomplete successful loads
        run: python3 benchmarks/stream_load_row_checks.py /tmp/datax-baseline /tmp/datax-candidate /tmp/sr-row-checks
      - name: StarRocks committed response loss and timeout status
        run: python3 benchmarks/stream_load_recovery_checks.py /tmp/datax-baseline /tmp/datax-candidate /tmp/sr-recovery-checks
      - name: Start disposable Doris
        run: |
          docker stop datax-perf-starrocks
          docker run -d --name datax-perf-doris --memory 4g \
            -e FE_HEAP=1024m -e BE_HEAP=512m \
            -p 127.0.0.1:29031:9030 -p 127.0.0.1:28031:8030 -p 127.0.0.1:28041:8040 \
            apache/doris@sha256:82a5cabc7900ebcd3d080412d636c0cebd6602799fffe2605c652b2ea7d42609
          probe='CREATE DATABASE IF NOT EXISTS datax_bench; CREATE TABLE IF NOT EXISTS datax_bench.ci_readiness (id BIGINT) DUPLICATE KEY(id) DISTRIBUTED BY HASH(id) BUCKETS 1 PROPERTIES("replication_num"="1");'
          for i in $(seq 1 120); do
            if docker exec datax-perf-doris mysql -uroot -h127.0.0.1 -P9030 -e "$probe"; then break; fi
            sleep 2
          done
          docker exec datax-perf-doris mysql -uroot -h127.0.0.1 -P9030 -e "$probe"
      - name: PostgreSQL to Doris and back
        run: python3 benchmarks/starrocks_checks.py /tmp/datax-baseline /tmp/datax-candidate /tmp/doris-checks --backend doris
      - name: PostgreSQL binary values through Doris
        run: |
          python3 benchmarks/olap_binary_checks.py /tmp/datax-baseline /tmp/doris-binary-baseline --backend doris --expect-legacy
          python3 benchmarks/olap_binary_checks.py /tmp/datax-candidate /tmp/doris-binary-candidate --backend doris
      - name: Doris queued failure against real server with response proxy
        run: |
          python3 benchmarks/stream_load_queue_checks.py /tmp/datax-baseline /tmp/doris-queue-before --backends doris --real-database --expect-unsafe
          python3 benchmarks/stream_load_queue_checks.py /tmp/datax-candidate /tmp/doris-queue-after --backends doris --real-database
      - name: Doris rejects incomplete successful loads
        run: python3 benchmarks/stream_load_row_checks.py /tmp/datax-baseline /tmp/datax-candidate /tmp/doris-row-checks --backend doris
      - name: Doris committed response loss and timeout status
        run: python3 benchmarks/stream_load_recovery_checks.py /tmp/datax-baseline /tmp/datax-candidate /tmp/doris-recovery-checks --backend doris
